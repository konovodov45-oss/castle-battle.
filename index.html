</style></head><body><canvas id="game"></canvas><div id="hud"><div class="top"><button class="circle" id="menu" aria-label="Пауза">☰</button><div class="tag" style="text-align:center;min-width:175px"><div id="epoch" class="small">КАМЕННЫЙ ВЕК</div><div id="level" class="title">Долина первых племён</div><div class="stats" style="justify-content:center"><span class="blue" id="blue">● 0</span><span class="red" id="red">● 0</span><span class="gold" id="clock">04:00</span></div></div><button class="circle" id="sound" aria-label="Звук">♫</button></div><div id="tip" class="help">Выбери синее поселение → цель</div><div class="bottom"><button class="control" data-pct="0.25">25%<br>войск</button><button class="control selected" data-pct="0.5">50%<br>войск</button><button class="control" data-pct="1">100%<br>войск</button><button id="ability" class="control ability">🪨<br>Камнепад</button><button id="speed" class="control">×1<br>скорость</button></div><div id="overlay" class="overlay"><div class="panel" id="panel"></div></div></div><script>

const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');let width=0,height=0,dpr=1,scale=1,ox=0,oy=0;
const $=x=>document.querySelector(x),TAU=Math.PI*2,clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),rnd=(n)=>{let x=Math.sin(n*127.1+78.23)*43758.5453;return x-Math.floor(x)},lerp=(a,b,t)=>a+(b-a)*t;
const ERAS=[
{name:'Каменный век',location:'Долина первых племён',unit:'Охотники',power:'Камнепад',emoji:'🪨',terrain:['#729d5c','#527c48','#264f3f','#c7b27a'],build:['Шалаш','Частокол','Пещера'],enemy:'Вождь Волк',desc:'Лесные тропы, первобытные деревни и быстрые охотники'},
{name:'Бронзовый век',location:'Долина двух рек',unit:'Копейщики',power:'Колесницы',emoji:'🐎',terrain:['#c9a76b','#ae8751','#597c69','#e4cd8b'],build:['Поселение','Зиккурат','Гарнизон'],enemy:'Царь песков',desc:'Пески, оазисы, реки и конные рейды'},
{name:'Железный век',location:'Легионный рубеж',unit:'Легионеры',power:'Щиты',emoji:'🛡️',terrain:['#84985f','#617c52','#526c5d','#b7aa79'],build:['Форт','Крепость','Казармы'],enemy:'Легат',desc:'Каменные дороги, укреплённые лагеря и строй щитов'},
{name:'Средневековье',location:'Королевский тракт',unit:'Рыцари',power:'Катапульта',emoji:'🏹',terrain:['#73955a','#4c774b','#366d75','#bdad79'],build:['Деревня','Замок','Башня'],enemy:'Чёрный барон',desc:'Каменные замки, осадные орудия и узкие переправы'},
{name:'Пороховой век',location:'Пепельная граница',unit:'Мушкетёры',power:'Артиллерия',emoji:'💣',terrain:['#9b9b76','#787a68','#476c74','#c1ad8d'],build:['Форт','Бастион','Арсенал'],enemy:'Генерал пороха',desc:'Бастионы, мушкеты, пушки и артиллерийские дуэли'},
{name:'Индустриальная эра',location:'Стальные долины',unit:'Стрелки',power:'Поезд',emoji:'🚂',terrain:['#918d73','#6f7969','#627d82','#c6b69c'],build:['Фабрика','Форт','Депо'],enemy:'Магнат стали',desc:'Железные дороги, заводы и бронепоезда'},
{name:'Современная эра',location:'Линия фронта',unit:'Пехота',power:'Авиаудар',emoji:'✈️',terrain:['#7d936e','#5d7959','#4d7076','#aeac8b'],build:['База','Бункер','Радар'],enemy:'Командующий',desc:'Бронетехника, укрепления и разведка'},
{name:'Космическая эра',location:'Колония Аврора',unit:'Десант',power:'Плазма',emoji:'⚡',terrain:['#685c87','#423e68','#436a8b','#968bb1'],build:['Купол','Цитадель','Реактор'],enemy:'Сингулярность',desc:'Купольные поселения, роботы и энергетические щиты'}];
const TOTAL=64,PER=8,STORAGE='castle_eras_v3_progress';let saved={unlocked:1,stars:{}};try{const v=JSON.parse(localStorage.getItem(STORAGE)||'null');if(v&&v.unlocked)saved=v}catch(e){};
let game=null,mode='menu',percent=.5,speed=1,muted=false,selected=-1,pointer=null,world={w:900,h:1320},camera={x:0,y:0},particles=[],last=0,tipTimeout=0;
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(saved))}catch(e){}};
function resize(){width=innerWidth;height=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);canvas.style.width=width+'px';canvas.style.height=height+'px';const usable=Math.max(450,height-155);scale=Math.min(width/980,usable/1410)*1.01;ox=(width-world.w*scale)/2;oy=(height-world.h*scale)/2+15;}
addEventListener('resize',resize);resize();
function tone(f=400,t=.08,kind='sine'){if(muted)return;try{let ac=tone.ac||(tone.ac=new(window.AudioContext||window.webkitAudioContext)());let o=ac.createOscillator(),g=ac.createGain();o.type=kind;o.frequency.setValueAtTime(f,ac.currentTime);g.gain.setValueAtTime(.045,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+t);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+t)}catch(e){}}
function show(html){$('#panel').innerHTML=html;$('#overlay').classList.remove('hidden')};function hide(){$('#overlay').classList.add('hidden')};
function menu(){mode='menu';game=null;selected=-1;show(`<div class="mark">🏰</div><div class="small">БОЕВАЯ СИСТЕМА • 4.0</div><h1>Битва замков<br>Сквозь эпохи</h1><p>Новые детализированные ландшафты и крепости, анимированные боевые отряды, настоящие столкновения, умные враги и восемь эпох истории.</p><div class="eras">${ERAS.map((e,i)=>`<button class="era ${saved.unlocked<i*PER+1?'locked':''}" data-era="${i}"><b>${i+1}. ${e.name} ${saved.unlocked<i*PER+1?'🔒':''}</b>${e.desc}</button>`).join('')}</div><button class="primary" id="start">⚔️ Играть — миссия ${Math.min(saved.unlocked,TOTAL)}</button><p class="note">64 миссии • 8 эпох • масштабирование пальцами • автосохранение</p>`);$('#start').onclick=()=>start(Math.min(saved.unlocked,TOTAL));document.querySelectorAll('[data-era]').forEach(b=>b.onclick=()=>{let idx=+b.dataset.era,m=idx*PER+1;if(m>saved.unlocked){tone(150);return}start(m)});}
function mkLevel(lvl){let era=Math.floor((lvl-1)/PER),stage=(lvl-1)%PER,e=ERAS[era],seed=lvl*103+21;let variant=stage%4;let nodes=[{x:195,y:1090,owner:1,n:35,type:0},{x:695,y:240,owner:2,n:27+stage*5,type:1},{x:260,y:740,owner:0,n:12+stage*3,type:0},{x:650,y:765,owner:0,n:14+stage*4,type:1},{x:450,y:485,owner:0,n:22+stage*3,type:2}];if(stage>=2)nodes.push({x:130,y:375,owner:2,n:18+stage*3,type:0});if(stage>=4)nodes.push({x:745,y:1090,owner:0,n:16+stage*3,type:2});if(stage>=6)nodes.push({x:440,y:160,owner:2,n:25+stage*3,type:1});
// Layout changes by mission: roads and buildings move together, never leave broken geometry.
for(let i=2;i<nodes.length;i++){nodes[i].x+=Math.round((rnd(seed+i)-.5)*100);nodes[i].y+=Math.round((rnd(seed+i*7)-.5)*100)}
if(variant===1){nodes[2].x+=120;nodes[3].x-=120}if(variant===2){nodes[4].x=690;nodes[4].y=515}if(variant===3){nodes[2].y=630;nodes[3].y=920}
let edges=[[0,2],[0,3],[2,4],[3,4],[4,1],[2,3]];if(nodes.length>5)edges.push([2,5],[5,1]);if(nodes.length>6)edges.push([3,6],[6,4]);if(nodes.length>7)edges.push([1,7],[7,4]);
return{lvl,era,stage,e,nodes:nodes.map((n,i)=>({...n,id:i,r:36+n.type*3,prod:0,attack:0})),edges,units:[],projectiles:[],elapsed:0,aiTimer:2+stage*.1,abilityCooldown:0,selected:0,end:false,wind:0,trees:[],rocks:[],shrubs:[],decor:[]};}
function fillTerrain(g){let seed=g.lvl*33;const safe=(x,y)=>g.nodes.every(n=>Math.hypot(n.x-x,n.y-y)>90)&&g.edges.every(([a,b])=>distSegment(x,y,g.nodes[a],g.nodes[b])>45);for(let i=0;i<250;i++){let x=25+rnd(seed+i*4)*850,y=30+rnd(seed+i*3.57+777)*1260;if(!safe(x,y))continue;let r=rnd(seed+i*22);if(r<.65)g.trees.push({x,y,s:8+rnd(i*9)*13,d:rnd(i*12)});else if(r<.80)g.rocks.push({x,y,s:6+rnd(i*11)*12,d:rnd(i*14)});else g.shrubs.push({x,y,s:5+rnd(i*8)*9})}for(let i=0;i<400;i++)g.decor.push({x:rnd(i*8.4+seed)*900,y:rnd(i*5.2+seed)*1320,n:rnd(i*4.4+5)})}
function distSegment(x,y,a,b){let t=clamp(((x-a.x)*(b.x-a.x)+(y-a.y)*(b.y-a.y))/((b.x-a.x)**2+(b.y-a.y)**2),0,1);return Math.hypot(x-lerp(a.x,b.x,t),y-lerp(a.y,b.y,t))}
function start(lvl){game=mkLevel(lvl);fillTerrain(game);mode='battle';particles=[];selected=-1;percent=.5;speed=1;resize();hide();$('.control[data-pct="0.5"]').classList.add('selected');document.querySelectorAll('[data-pct]').forEach(b=>b.classList.toggle('selected',+b.dataset.pct===.5));updateHUD();hint('Нажми на синее поселение, затем на цель');tone(490,.12)}
function hint(s){$('#tip').textContent=s;$('#tip').classList.remove('hidden');tipTimeout=performance.now()+3500}
function updateHUD(){if(!game)return;let g=game;$('#epoch').textContent=g.e.name.toUpperCase();$('#level').textContent=`Миссия ${g.lvl} · ${g.e.location}`;let n1=g.nodes.filter(n=>n.owner===1).reduce((s,n)=>s+Math.floor(n.n),0)+g.units.filter(u=>u.owner===1).reduce((s,u)=>s+Math.floor(u.n),0),n2=g.nodes.filter(n=>n.owner===2).reduce((s,n)=>s+Math.floor(n.n),0)+g.units.filter(u=>u.owner===2).reduce((s,u)=>s+Math.floor(u.n),0);$('#blue').textContent='● '+n1;$('#red').textContent='● '+n2;$('#clock').textContent=Math.max(0,Math.floor(270-g.elapsed/1)).toString().padStart(3,'0').replace(/(\d+)(\d\d)$/,'$1:$2');let ab=$('#ability');ab.innerHTML=`${g.e.emoji}<br>${g.abilityCooldown>0?Math.ceil(g.abilityCooldown)+'с':g.e.power}`;ab.style.opacity=g.abilityCooldown>0?'.5':'1';$('#speed').innerHTML=`×${speed}<br>скорость`}
function path(a,b){let dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy),ux=dx/dist,uy=dy/dist;return {ux,uy,dist}}
function send(a,b,ratio,owner=1){if(a.owner!==owner||a.id===b.id||a.n<3)return;let n=Math.floor(a.n*ratio);if(n<1)return;a.n-=n;let p=path(a,b),formation=Math.min(7,Math.max(1,Math.ceil(n/7)));for(let i=0;i<formation;i++){let count=Math.floor(n/formation)+(i<n%formation?1:0),offset=(i-(formation-1)/2)*17;game.units.push({x:a.x+p.ux*43+(-p.uy)*offset,y:a.y+p.uy*43+(p.ux)*offset,tx:b.x,ty:b.y,target:b.id,owner,n:count,phase:rnd(i*34+game.elapsed)*TAU,speed:(owner===1?68:65)+game.era*2,lateral:offset,health:1,engaged:false,hit:0})}for(let i=0;i<7;i++)particles.push({x:a.x,y:a.y,vx:(rnd(i+3)-.5)*50,vy:(rnd(i+6)-.5)*40,life:.4,color:owner===1?'#74c8ff':'#f27a65'});tone(owner===1?350:210,.08,'triangle')}
function ai(g,dt){g.aiTimer-=dt;if(g.aiTimer>0)return;g.aiTimer=clamp(3.1-g.stage*.19-g.era*.12,1.1,3.1)+rnd(g.elapsed*9)*.8;let bases=g.nodes.filter(n=>n.owner===2&&n.n>14);if(!bases.length)return;let src=bases.sort((a,b)=>b.n-a.n)[0];let targets=g.nodes.filter(n=>n.owner!==2).map(t=>({t,score:(t.owner===1?35:10)+Math.max(0,45-t.n)*1.7-Math.hypot(t.x-src.x,t.y-src.y)*.055+(t.type===1?12:0)})).sort((a,b)=>b.score-a.score);let t=targets[0]?.t;if(t&&src.n>t.n*.65+10)send(src,t,src.n>t.n+25?.78:.55,2);else{let ally=g.nodes.filter(n=>n.owner===2&&n.id!==src.id).sort((a,b)=>a.n-b.n)[0];if(ally&&src.n>ally.n+20)send(src,ally,.45,2)}}
function update(dt){
 if(mode!=='battle'||!game||game.end)return;
 let g=game;dt=Math.min(dt,.045)*speed;g.elapsed+=dt;g.wind+=dt;
 g.abilityCooldown=Math.max(0,g.abilityCooldown-dt);
 // Fixed troop economy: growth is deliberately gradual, with diminishing returns.
 for(let n of g.nodes)if(n.owner){
   let base=n.owner===1?.37:(.35+g.stage*.031+g.era*.016);
   let slowdown=n.n>90?.55:n.n>55?.75:1;
   n.prod+=dt*base*(n.type===1?1.12:1)*slowdown;
   if(n.prod>=1){let c=Math.floor(n.prod);n.n=Math.min(140,n.n+c);n.prod-=c}
 }
 for(const u of g.units){u.engaged=false;u.hit=Math.max(0,(u.hit||0)-dt)}
 // Actual moving-army encounters. Squads lock into melee rather than ghost through each other.
 const paired=new Set();
 for(let i=0;i<g.units.length;i++){
   let a=g.units[i];if(a.dead||a.n<=0||paired.has(a))continue;
   let best=null,bestD=52;
   for(let j=i+1;j<g.units.length;j++){
     let b=g.units[j];if(b.dead||b.n<=0||b.owner===a.owner||paired.has(b))continue;
     let d=Math.hypot(a.x-b.x,a.y-b.y);
     if(d<bestD){best=b;bestD=d}
   }
   if(!best)continue;
   let b=best;paired.add(a);paired.add(b);a.engaged=b.engaged=true;
   let dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy)||1;
   // Keep opposing combatants apart and visibly facing one another.
   let push=Math.max(0,37-dist)*.45;
   a.x-=dx/dist*push;a.y-=dy/dist*push;
   b.x+=dx/dist*push;b.y+=dy/dist*push;
   a.face=Math.atan2(b.y-a.y,b.x-a.x);
   b.face=Math.atan2(a.y-b.y,a.x-b.x);
   const toughA=1+(a.owner===1?.06:0),toughB=1+(b.owner===2?.05+g.stage*.012:0);
   let dmgA=Math.min(a.n,(1.6+Math.sqrt(Math.max(0,b.n))*.43)*dt*toughB);
   let dmgB=Math.min(b.n,(1.6+Math.sqrt(Math.max(0,a.n))*.43)*dt*toughA);
   a.n-=dmgA;b.n-=dmgB;
   a.hit=b.hit=.20;
   if(rnd(Math.floor(g.elapsed*23)+i*13)>.58){
     particles.push({x:(a.x+b.x)/2+(rnd(g.elapsed*85+i)-.5)*13,y:(a.y+b.y)/2-8+(rnd(g.elapsed*37+i)-.5)*12,vx:(rnd(i+g.elapsed*3)-.5)*40,vy:-22-rnd(i*3+g.elapsed)*30,life:.25,color:rnd(i+g.elapsed)> .5?'#ffdb86':'#f8ede1',size:2+rnd(i+13)*3});
   }
   if(a.n<.6)a.dead=true;
   if(b.n<.6)b.dead=true;
 }
 for(let u of g.units){
   if(u.dead||u.engaged)continue;
   let p=path(u,{x:u.tx,y:u.ty}),step=u.speed*dt;
   if(p.dist<=step+48){
      let n=g.nodes[u.target];
      if(n.owner===u.owner)n.n=Math.min(140,n.n+u.n);
      else{let damage=u.n*(u.owner===1?1:1.04+g.stage*.025);n.n-=damage;
        if(n.n<=0){n.owner=u.owner;n.n=Math.max(2,Math.round(-n.n*.45+u.n*.18));
           for(let j=0;j<20;j++)particles.push({x:n.x,y:n.y,vx:(rnd(j*3)-.5)*110,vy:(rnd(j*7)-.5)*110,life:.7+rnd(j)*.4,color:j%2?'#ffc87a':'#d8e4b1'});
           tone(u.owner===1?600:180,.21,'sawtooth');hint(u.owner===1?'Поселение захвачено!':'Противник занял поселение');
        }
      }
      u.dead=true;
   }else{u.x+=p.ux*step;u.y+=p.uy*step;u.face=Math.atan2(p.uy,p.ux)}
 }
 g.units=g.units.filter(u=>!u.dead);
 for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;p.vx*=.96;p.vy*=.96}
 particles=particles.filter(p=>p.life>0).slice(-180);
 ai(g,dt);
 if(g.nodes.every(n=>n.owner===1))finish(true);
 else if(g.nodes.every(n=>n.owner!==1)&&g.units.every(u=>u.owner!==1))finish(false);
 else if(g.elapsed>=270)finish(false);

}

function render(){if(!game){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#1a3e35';ctx.fillRect(0,0,width,height);return}let g=game;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,width,height);ctx.fillStyle='#101f1a';ctx.fillRect(0,0,width,height);ctx.save();ctx.translate(ox+camera.x,oy+camera.y);ctx.scale(scale,scale);terrain(g);for(let n of g.nodes)drawStructure(n,g);for(let u of g.units)soldier(u,g.elapsed,g);for(let p of particles){ctx.globalAlpha=clamp(p.life,0,1);ellipse(p.x,p.y,p.size||3,p.size||3,p.color)}ctx.globalAlpha=1;ctx.restore();}
